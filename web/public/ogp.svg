<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="300" cy="315" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181929"/>
      <stop offset="100%" stop-color="#0d0e17"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0e17"/>
  <circle cx="300" cy="315" r="320" fill="url(#bgGlow)"/>

  <!-- Color wheel: 12 sectors × 30° (hsl(h, 55%, 42%)) -->
  <path d="M300,315 L300,115 A200,200 0 0,1 400,142 Z" fill="hsl(0,55%,42%)"/>
  <path d="M300,315 L400,142 A200,200 0 0,1 473,215 Z" fill="hsl(30,55%,42%)"/>
  <path d="M300,315 L473,215 A200,200 0 0,1 500,315 Z" fill="hsl(60,55%,42%)"/>
  <path d="M300,315 L500,315 A200,200 0 0,1 473,415 Z" fill="hsl(90,55%,42%)"/>
  <path d="M300,315 L473,415 A200,200 0 0,1 400,488 Z" fill="hsl(120,55%,42%)"/>
  <path d="M300,315 L400,488 A200,200 0 0,1 300,515 Z" fill="hsl(150,55%,42%)"/>
  <path d="M300,315 L300,515 A200,200 0 0,1 200,488 Z" fill="hsl(180,55%,42%)"/>
  <path d="M300,315 L200,488 A200,200 0 0,1 127,415 Z" fill="hsl(210,55%,42%)"/>
  <path d="M300,315 L127,415 A200,200 0 0,1 100,315 Z" fill="hsl(240,55%,42%)"/>
  <path d="M300,315 L100,315 A200,200 0 0,1 127,215 Z" fill="hsl(270,55%,42%)"/>
  <path d="M300,315 L127,215 A200,200 0 0,1 200,142 Z" fill="hsl(300,55%,42%)"/>
  <path d="M300,315 L200,142 A200,200 0 0,1 300,115 Z" fill="hsl(330,55%,42%)"/>

  <!-- Center hole (donut) -->
  <circle cx="300" cy="315" r="82" fill="#0d0e17"/>

  <!-- Outer / inner ring borders -->
  <circle cx="300" cy="315" r="200" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <circle cx="300" cy="315" r="82"  fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Selected-color indicator (hue ≈ 225°, blue sector) -->
  <circle cx="167" cy="423" r="9"   fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
  <circle cx="167" cy="423" r="3.5" fill="rgba(255,255,255,0.85)"/>

  <!-- Center label -->
  <text x="300" y="313" text-anchor="middle"
        font-family="ui-monospace,'Courier New',monospace"
        font-size="11" letter-spacing="2" fill="rgba(255,255,255,0.28)">L = 0.18</text>
  <text x="300" y="328" text-anchor="middle"
        font-family="ui-monospace,'Courier New',monospace"
        font-size="9" letter-spacing="3" fill="rgba(255,255,255,0.15)">LOCKED</text>

  <!-- Vertical divider -->
  <line x1="552" y1="72" x2="552" y2="558" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ── Right side ── -->

  <!-- WCAG 2.2 pill badge -->
  <rect x="590" y="155" width="112" height="26" rx="3"
        fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="646" y="173" text-anchor="middle"
        font-family="ui-monospace,'Courier New',monospace"
        font-size="11" letter-spacing="4" fill="#7070a8">WCAG 2.2</text>

  <!-- Title line 1: light weight, muted -->
  <text x="590" y="248"
        font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif"
        font-size="44" font-weight="300" letter-spacing="1" fill="#6868a0">Relative Luminous</text>

  <!-- Title line 2: bold, bright -->
  <text x="590" y="336"
        font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif"
        font-size="76" font-weight="700" letter-spacing="-1" fill="#eaeaf8">Color Wheel</text>

  <!-- Separator -->
  <line x1="590" y1="366" x2="1110" y2="366" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="590" y="403"
        font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif"
        font-size="20" fill="#585882" letter-spacing="0">Luminance-locked hue &amp; saturation exploration</text>

  <!-- Description -->
  <text x="590" y="438"
        font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif"
        font-size="16" fill="#464668">Every point on the wheel shares the same WCAG 2.2 relative luminance</text>
  <text x="590" y="460"
        font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif"
        font-size="16" fill="#464668">— instant AA / AAA pass/fail against white, black, and a custom color.</text>

  <!-- AA / AAA pass badges -->
  <rect x="590" y="490" width="44" height="22" rx="2"
        fill="rgba(93,222,138,0.08)" stroke="rgba(93,222,138,0.30)" stroke-width="1"/>
  <text x="612" y="506" text-anchor="middle"
        font-family="ui-monospace,'Courier New',monospace"
        font-size="11" letter-spacing="2" fill="#5dde8a">AA</text>

  <rect x="645" y="490" width="52" height="22" rx="2"
        fill="rgba(93,222,138,0.08)" stroke="rgba(93,222,138,0.30)" stroke-width="1"/>
  <text x="671" y="506" text-anchor="middle"
        font-family="ui-monospace,'Courier New',monospace"
        font-size="11" letter-spacing="2" fill="#5dde8a">AAA</text>

  <!-- Contrast ratio display -->
  <text x="712" y="506"
        font-family="ui-monospace,'Courier New',monospace"
        font-size="13" fill="#38385c" letter-spacing="1">7.43:1  ·  Normal AA / AAA</text>

</svg>
